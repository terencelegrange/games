<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monkey Jump • 1981 Arcade Scaffolding Classic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐵</text></svg>">
</head>
<body>

  <!-- CRT Monitor Simulation Overlay -->
  <div id="crt-overlay" class="crt-overlay"></div>

  <!-- Arcade Cabinet Header -->
  <header class="arcade-header">
    <div class="brand-group">
      <a href="../index.html" class="brand-back" id="btn-back-hub" title="Return to Games Dashboard">◀ DASHBOARD</a>
      <h1 class="brand-title">🐵 MONKEY JUMP</h1>
    </div>
    <div class="header-controls">
      <button id="btn-toggle-sound" class="arcade-btn active" title="Toggle Sound (M)">
        <span id="sound-icon">🔊</span> SOUND
      </button>
      <button id="btn-toggle-crt" class="arcade-btn active" title="Toggle CRT Filter">
        CRT: ON
      </button>
    </div>
  </header>

  <!-- Cabinet Stage -->
  <main class="cabinet-stage">
    <div class="cabinet-sub-bar">
      <span class="stage-title">CONSTRUCTION TOWER • 1981 ARCADE TRIBUTE</span>
      <div style="display: flex; gap: 8px;">
        <button id="btn-pause-game" class="arcade-btn">PAUSE</button>
        <button id="btn-restart-game" class="arcade-btn">RESTART</button>
      </div>
    </div>

    <!-- Scoreboard HUD -->
    <div class="scoreboard">
      <div class="hud-group">
        <span class="hud-label">1UP SCORE</span>
        <span id="hud-score" class="hud-val score">000000</span>
      </div>
      <div class="hud-group">
        <span class="hud-label">HIGH SCORE</span>
        <span id="hud-high-score" class="hud-val">000000</span>
      </div>
      <div class="hud-group">
        <span class="hud-label">BONUS</span>
        <span id="hud-bonus" class="hud-val bonus">5000</span>
      </div>
      <div class="hud-group">
        <span class="hud-label">STAGE</span>
        <span id="hud-level" class="hud-val">1</span>
      </div>
      <div class="hud-group">
        <span class="hud-label">LIVES</span>
        <span id="hud-lives" class="hud-val lives">🏃 🏃 🏃</span>
      </div>
    </div>

    <!-- Cabinet Frame & Canvas -->
    <div class="cabinet-frame">
      <div id="game-canvas-container" class="canvas-container">
        <canvas id="monkey-canvas" width="480" height="640"></canvas>
        <div id="floating-banner" class="floating-banner">★ STAGE 1 RESCUED! ★</div>
        <div id="game-overlay" class="game-overlay">
          <h2 id="overlay-title" class="overlay-title">GAME OVER</h2>
          <div class="overlay-stats">
            <div class="overlay-stat-item">
              <span>FINAL SCORE</span>
              <span id="overlay-final-score">000000</span>
            </div>
            <div class="overlay-stat-item">
              <span>STAGE REACHED</span>
              <span id="overlay-final-stage">STAGE 1</span>
            </div>
          </div>
          <button id="overlay-restart-btn" class="overlay-restart-btn">PLAY AGAIN ➜</button>
        </div>
      </div>
    </div>

    <!-- Virtual Controls Deck for Touch / Mobile Handheld -->
    <div class="controls-deck">
      <div class="virtual-dpad">
        <button id="dpad-up" class="dpad-btn" aria-label="Climb Up">▲</button>
        <div class="dpad-row">
          <button id="dpad-left" class="dpad-btn" aria-label="Walk Left">◀</button>
          <button id="dpad-down" class="dpad-btn" aria-label="Climb Down">▼</button>
          <button id="dpad-right" class="dpad-btn" aria-label="Walk Right">▶</button>
        </div>
      </div>

      <div class="action-buttons">
        <button id="btn-action-jump" class="action-btn-jump" aria-label="Jump">JUMP</button>
      </div>
    </div>

    <div class="controls-hint">
      ARROWS / WASD = MOVE & CLIMB • SPACEBAR = JUMP • P = PAUSE • M = SOUND • ESC = DASHBOARD
    </div>
  </main>

  <script src="./js/bundle.js" type="module"></script>
</body>
</html>
