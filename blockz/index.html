<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOCKZ | Standalone Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- CRT Monitor Simulation Overlay -->
  <div id="crt-overlay" class="crt-overlay"></div>

  <!-- Header Navigation -->
  <header class="cabinet-header">
    <a href="../index.html" class="arcade-btn btn-back" id="btn-back-hub" title="Return to Games Dashboard">
      <span>◀</span> DASHBOARD
    </a>
    <div class="logo-container">
      <span class="logo-icon">🧱</span>
      <span class="logo-title">BLOCKZ</span>
    </div>
    <div class="header-controls">
      <button id="btn-toggle-sound" class="arcade-btn" title="Toggle Sound">
        <span id="sound-icon">🔊</span>
      </button>
      <button id="btn-toggle-crt" class="arcade-btn active" title="Toggle CRT Scanlines">
        <span>📺</span>
      </button>
    </div>
  </header>

  <!-- Cabinet Stage -->
  <main class="cabinet-stage">
    <div class="cabinet-sub-bar">
      <span class="stage-title">BLOCKZ</span>
      <div style="display: flex; gap: 8px;">
        <button id="btn-pause-game" class="arcade-btn">PAUSE</button>
        <button id="btn-restart-game" class="arcade-btn">RESTART</button>
      </div>
    </div>

    <!-- Scoreboard HUD -->
    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span id="hud-score" class="score-val">0000</span>
      </div>
      <div class="score-box" style="text-align: right;">
        <span class="score-label">HIGH SCORE</span>
        <span id="hud-high-score" class="score-val">0000</span>
      </div>
    </div>

    <!-- Cabinet Bezel & Game Canvas -->
    <div class="cabinet-frame">
      <div id="game-canvas-container" class="canvas-container">
        <!-- Canvas injected by main.js -->
      </div>
    </div>

    <!-- Footer HUD (Lines & Level) -->
    <div class="cabinet-footer-hud">
      <div class="lines-indicator">
        LINES: <span id="hud-lines-num">0</span>
      </div>
      <div class="level-indicator">
        LEVEL <span id="hud-level-num">1</span>
      </div>
    </div>

    <!-- Virtual Controls Deck for Touch/Mouse -->
    <div class="controls-deck">
      <div class="virtual-controls">
        <button id="dpad-up" class="dpad-btn" aria-label="Rotate">↻</button>
        <div class="dpad-row">
          <button id="dpad-left" class="dpad-btn" aria-label="Left">◀</button>
          <button id="dpad-down" class="dpad-btn" aria-label="Soft Drop">▼</button>
          <button id="dpad-right" class="dpad-btn" aria-label="Right">▶</button>
        </div>
      </div>

      <div class="action-buttons">
        <button id="btn-action-hold" class="arcade-action-btn btn-hold" title="Hold Piece (C / Shift)">HOLD</button>
        <button id="btn-action-drop" class="arcade-action-btn" title="Hard Drop (Space)">DROP</button>
      </div>
    </div>

    <div class="controls-hint">
      ← → = MOVE • ↑ = ROTATE • ↓ = SOFT DROP • SPACE = HARD DROP • C = HOLD • P = PAUSE • ESC = DASHBOARD
    </div>
  </main>

  <script src="js/bundle.js" defer></script>
</body>
</html>
